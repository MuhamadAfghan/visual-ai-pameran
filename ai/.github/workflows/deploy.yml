name: Deploy AI Service

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: GH_PAT
          script: |
            set -e
            cd ${{ secrets.VPS_DEPLOY_PATH }}

            echo "==> Pulling latest ai..."
            git -C ai remote set-url origin https://$GH_PAT@github.com/meidymahardika/md-cctv-monitoring-ai.git
            cd ai && git fetch origin && git reset --hard origin/main && cd ..

            echo "==> Rebuilding ai-service..."
            docker compose build --no-cache ai-service

            echo "==> Restarting ai-service..."
            docker compose up -d --no-deps ai-service

            docker image prune -f
            echo "==> Deploy AI service done."
        env:
          GH_PAT: ${{ secrets.GH_PAT }} 