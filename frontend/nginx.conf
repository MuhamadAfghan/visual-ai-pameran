server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend-web:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE endpoints (/live-stream) hold the response open indefinitely —
        # nginx's default buffering would sit on backend-web's pushed events
        # instead of forwarding them immediately, killing realtime delivery.
        proxy_buffering off;
    }

    # Evidence/snapshot JPEGs — backend-web serves these itself via
    # express.static (see app.ts), not through /api/, so they need their own
    # proxy location; otherwise they fall through to the SPA catch-all below
    # and nginx serves index.html (200 OK, wrong content-type) instead of
    # the actual image.
    location /storage/ {
        proxy_pass http://backend-web:8080/storage/;
        proxy_set_header Host $host;
    }

    # Hashed build assets (/assets/*.[hash].js|css) are safe to cache
    # indefinitely — a new build always ships a new filename.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html references the current build's hashed asset filenames,
        # so it must never be served stale — otherwise a browser that cached
        # it keeps loading an old JS bundle forever, even after a rebuild.
        add_header Cache-Control "no-cache";
    }
}
